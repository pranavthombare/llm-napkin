name: Release Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # This is important for creating releases
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          
      - name: Install dependencies
        run: npm ci
        
      - name: Check code
        run: npm run check-types && npm run lint
        
      - name: Package extension
        id: package
        run: |
          npx vsce package
          echo "VSIX_PATH=$(find . -name "*.vsix" -type f | head -n 1)" >> $GITHUB_OUTPUT
        
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.package.outputs.VSIX_PATH }}
          name: "Release v${{ steps.get_version.outputs.VERSION }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          
      - name: Publish to VS Code Marketplace
        run: npx vsce publish -p ${{ secrets.VSCODE_MARKETPLACE_TOKEN }}
          
      - name: Publish to Open VSX Registry
        run: npx ovsx publish ${{ steps.package.outputs.VSIX_PATH }} -p ${{ secrets.OPEN_VSX_TOKEN }}