name: Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: python3 -m unittest discover -s tests -p 'test_distribution.py'

  package:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up static Linux linking
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          linker_key="CARGO_TARGET_$(printf '%s' "$RELEASE_TARGET" | tr '[:lower:]-' '[:upper:]_')_LINKER"
          cc_key="CC_$(printf '%s' "$RELEASE_TARGET" | tr '-' '_')"
          echo "$linker_key=musl-gcc" >> "$GITHUB_ENV"
          echo "$cc_key=musl-gcc" >> "$GITHUB_ENV"
      - name: Test target and build executable
        shell: bash
        run: |
          cargo test --locked --target "$RELEASE_TARGET"
          cargo build --release --locked --target "$RELEASE_TARGET"
      - name: Package and verify binary version
        shell: bash
        run: python scripts/package.py --target "$RELEASE_TARGET"
      - name: Smoke-test Unix installer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh install.sh --archive-dir dist --bin-dir "$RUNNER_TEMP/napkin-bin"
          "$RUNNER_TEMP/napkin-bin/llm-napkin" --help
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify archives and assemble checksum manifest
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS
          (cd dist && sha256sum --check --strict SHA256SUMS)
      - name: Publish complete release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            test "$(jq -r .isDraft "$RUNNER_TEMP/release.json")" = true || {
              echo "Release already published; refusing to replace existing binaries." >&2
              exit 1
            }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "llm-napkin $RELEASE_TAG" --notes-file docs/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS install.sh --clobber
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
